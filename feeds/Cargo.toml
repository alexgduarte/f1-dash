[package]
name = "feeds"
version = "0.1.0"
edition = "2024"
publish = false
authors = ["slowlydev"]
description = "Live timing feed adapters shared by the realtime server and the native app"

[lib]
path = "src/lib.rs"

[dependencies]
signalr = { workspace = true }

anyhow = "1.0.98"
futures = "0.3.31"
reqwest = { version = "0.13.1", features = ["json", "gzip"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
tokio = { version = "1.45.1", features = ["rt", "macros", "sync", "time", "fs"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots", "url"] }
tracing = "0.1.41"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
ical = "0.11"
regex = "1.12.2"
