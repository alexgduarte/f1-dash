name: app

# Builds the native app for every platform. Pushing a `app-v*` tag also
# drafts a GitHub release with the desktop installers attached; the mobile
# builds are uploaded as workflow artifacts.

on:
  push:
    tags:
      - app-v*
  pull_request:
    paths:
      - dashboard/**
      - feeds/**
      - signalr/**
      - .github/workflows/app.yaml
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # one universal binary runs natively on Apple Silicon and Intel Macs
          - name: macos
            runner: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: windows
            runner: windows-latest
            args: ""
            rust-targets: ""
          - name: linux-x64
            runner: ubuntu-22.04
            args: ""
            rust-targets: ""
          - name: linux-arm64
            runner: ubuntu-22.04-arm
            args: ""
            rust-targets: ""

    name: desktop (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version-file: dashboard/.nvmrc

      - name: Enable corepack
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: dashboard/src-tauri -> target

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: yarn install --immutable

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: dashboard
          tauriScript: yarn tauri
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/app-v') && github.ref_name || '' }}
          releaseName: f1-dash ${{ github.ref_name }}
          releaseBody: Desktop installers are attached below. Android and iOS builds are in the workflow run's artifacts.
          releaseDraft: true

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          # target/<triple>/release for cross builds such as the universal macOS one
          path: |
            dashboard/src-tauri/target/release/bundle/
            dashboard/src-tauri/target/*/release/bundle/
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    env:
      # set these repository secrets to get a signed, installable release APK;
      # without them the job produces a debug APK
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version-file: dashboard/.nvmrc

      - name: Enable corepack
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: dashboard/src-tauri -> target

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: yarn install --immutable

      # the Android Studio project is generated, not committed
      - name: Generate the Android project
        working-directory: dashboard
        run: yarn tauri android init --ci

      - name: Build a signed release APK
        if: env.ANDROID_KEYSTORE != ''
        working-directory: dashboard
        run: |
          yarn tauri android build --apk
          echo "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          unsigned=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -n1)
          build_tools=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n1)
          "$build_tools/zipalign" -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --out f1-dash-android.apk "$RUNNER_TEMP/aligned.apk"

      - name: Build a debug APK
        if: env.ANDROID_KEYSTORE == ''
        working-directory: dashboard
        run: |
          yarn tauri android build --apk --debug
          cp "$(find src-tauri/gen/android/app/build/outputs/apk -name '*-debug.apk' | head -n1)" f1-dash-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dashboard/f1-dash-android.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    env:
      # set these repository secrets (see the Tauri iOS code signing guide) for
      # an IPA installable on iPhone and iPad; without them the job builds for
      # the simulator, which needs no signing
      IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: dashboard/.nvmrc

      - name: Enable corepack
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: dashboard/src-tauri -> target

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: yarn install --immutable

      # the Xcode project is generated, not committed; it targets iPhone and iPad
      - name: Generate the Xcode project
        working-directory: dashboard
        run: yarn tauri ios init --ci

      - name: Build a signed IPA
        if: env.IOS_CERTIFICATE != ''
        working-directory: dashboard
        run: yarn tauri ios build

      - name: Build for the simulator
        if: env.IOS_CERTIFICATE == ''
        working-directory: dashboard
        run: yarn tauri ios build --debug --target aarch64-sim

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: |
            dashboard/src-tauri/gen/apple/build/**/*.ipa
            dashboard/src-tauri/gen/apple/build/**/*.app
          if-no-files-found: error
