[package]
name = "f1-dash-app"
version = "4.0.6"
description = "Real-time motorsport timing for desktop and mobile"
authors = ["slowlydev"]
license = "AGPL-3.0-or-later"
edition = "2024"
publish = false

[lib]
# staticlib and cdylib are what the iOS and Android builds link against
name = "f1_dash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
feeds = { path = "../../feeds" }

chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3.31"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.6", features = [] }
tauri-plugin-opener = "2.5.5"
tokio = { version = "1.45.1", features = ["rt", "sync"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
